<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alerte prix PS5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0A0A0A;
    --muted: #6B6B6B;
    --paper: #FFFFFF;
    --line: #E3E3E1;
    --accent: #1B3A5C;
    --accent-soft: #EDF1F5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    border-top: 1px solid var(--ink);
    padding-top: 28px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 18px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 28px;
    line-height: 1.25;
    margin: 0 0 12px;
    max-width: 22ch;
  }

  p.lead {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    margin: 0 0 28px;
    max-width: 34ch;
  }

  form { display: flex; flex-direction: column; gap: 14px; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 12.5px;
    color: var(--muted);
  }

  input {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 12px 0;
    border: none;
    border-bottom: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
  }

  input:focus { border-bottom-color: var(--accent); }

  input[type="number"] { font-variant-numeric: tabular-nums; }

  button {
    margin-top: 10px;
    padding: 13px 20px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover { background: var(--accent); }
  button:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }

  .status {
    margin-top: 16px;
    font-size: 13.5px;
    line-height: 1.5;
    display: none;
  }

  .status.show { display: block; }
  .status.success { color: var(--accent); }
  .status.error { color: #B3261E; }

  .fine {
    margin-top: 20px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow"><span class="dot"></span>Suivi de prix</div>
  <h1>Soyez prévenu dès que le prix baisse</h1>
  <p class="lead">
    On surveille les principaux marchands pour vous. Un email, quand ça vaut le coup — rien d'autre.
  </p>

  <form id="alert-form">
    <div class="field">
      <label for="email">Adresse email</label>
      <input type="email" id="email" name="email" placeholder="vous@exemple.com" required />
    </div>
    <div class="field">
      <label for="targetPrice">Vous alerter sous ce prix (optionnel)</label>
      <input type="number" id="targetPrice" name="targetPrice" placeholder="450" min="1" step="1" />
    </div>
    <button type="submit" id="submit-btn">Activer l'alerte</button>
  </form>

  <p id="status" class="status"></p>

  <p class="fine">Désabonnement possible à tout moment. Pas de spam, une alerte par baisse de prix pertinente.</p>
</div>

<script>
  const form = document.getElementById('alert-form');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const targetPriceRaw = document.getElementById('targetPrice').value.trim();
    const targetPrice = targetPriceRaw ? Number(targetPriceRaw) : null;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Activation…';
    statusEl.className = 'status';

    try {
      const res = await fetch('/.netlify/functions/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, targetPrice }),
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || "Une erreur est survenue.");
      }

      statusEl.textContent = data.message || 'Alerte activée. Vérifiez votre boîte mail.';
      statusEl.className = 'status show success';
      form.reset();
    } catch (err) {
      statusEl.textContent = err.message || "Une erreur est survenue, réessayez plus tard.";
      statusEl.className = 'status show error';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Activer l'alerte";
    }
  });
</script>

</body>
</html>
