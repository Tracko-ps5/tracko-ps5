[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

# Redirection de toutes les requêtes /api/* vers la Netlify Function TRACKO
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Redirection SPA standard pour React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
